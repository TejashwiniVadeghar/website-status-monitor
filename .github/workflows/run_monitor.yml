name: Daily Website Monitor

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual triggers

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests black # Added 'black' here

    # NEW STEP: Verifies your code is perfectly formatted
    - name: Check code formatting with Black
      run: black --check monitor.py

    - name: Run monitor script
      run: python monitor.py

    - name: Commit and push latest report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add status_report.md
        git diff-index --quiet HEAD || git commit -m "Update daily status report"
        git push
