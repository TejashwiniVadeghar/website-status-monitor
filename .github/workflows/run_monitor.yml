name: Daily Website Monitor

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual triggers

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4.2.2 # Fixed Node warning

    - name: Set up Python
      uses: actions/setup-python@v5.3.0 # Fixed Node warning
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests flake8

    # NEW: Checks your code layout without breaking the pipeline
    - name: Run Code Linter (Warnings Only)
      run: flake8 monitor.py --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true # Prevents lint errors from stopping your script

    - name: Run monitor script
      run: python monitor.py

    - name: Commit and push latest report
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add status_report.md
        git diff-index --quiet HEAD || git commit -m "Update daily status report"
        git push
